<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Velha Premium</title>
    <!-- Google Fonts para tipografia elegante -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --color-x: #3b82f6;
            --color-o: #10b981;
            --color-x-glow: rgba(59, 130, 246, 0.4);
            --color-o-glow: rgba(16, 185, 129, 0.4);
            --accent: #6366f1;
            --board-gap: 12px;
            --radius-lg: 16px;
            --radius-md: 12px;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            --grid-size: 3;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
        }

        /* Cabeçalho e Título */
        header {
            text-align: center;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }

        .header-title {
            text-align: left;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--color-x), var(--color-o));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        /* Botão do Menu de Configurações */
        .settings-trigger {
            background-color: var(--bg-secondary);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: transform 0.2s, background-color 0.2s;
        }

        .settings-trigger:hover {
            transform: rotate(45deg);
            background-color: rgba(255, 255, 255, 0.08);
        }

        /* Painel de Configurações / Controles */
        .controls {
            width: 100%;
            background-color: var(--bg-secondary);
            padding: 12px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .mode-selection, .difficulty-selection {
            display: flex;
            background: rgba(0, 0, 0, 0.2);
            padding: 4px;
            border-radius: var(--radius-md);
            position: relative;
        }

        .mode-btn, .diff-btn {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 8px 12px;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            border-radius: calc(var(--radius-md) - 2px);
            transition: all 0.3s ease;
            z-index: 1;
        }

        .mode-btn.active, .diff-btn.active {
            color: var(--text-main);
            background: var(--accent);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        /* Ocultar dificuldade no modo 2 jogadores */
        .difficulty-selection.hidden {
            display: none;
        }

        /* Placar de Pontos */
        .scoreboard {
            width: 100%;
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }

        .score-box {
            flex: 1;
            background-color: var(--bg-secondary);
            padding: 10px;
            border-radius: var(--radius-lg);
            text-align: center;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.2s;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 0; /* evita overflow de textos grandes */
        }

        .score-box.active-turn {
            transform: scale(1.03);
            border-color: var(--accent);
        }

        .score-box.active-turn::after {
            content: '';
            position: absolute;
            bottom: -3px;
            left: 50%;
            transform: translateX(-50%);
            width: 40%;
            height: 3px;
            background: var(--accent);
            border-radius: 2px;
        }

        .score-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 2px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .score-value {
            font-size: 1.4rem;
            font-weight: 800;
        }

        .score-box.player-x .score-value { color: var(--color-x); }
        .score-box.player-o .score-value { color: var(--color-o); }
        .score-box.draws .score-value { color: var(--text-main); }

        /* Tabuleiro do Jogo */
        .board-container {
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: var(--bg-secondary);
            border-radius: var(--radius-lg);
            padding: 12px;
            box-shadow: var(--shadow);
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .board {
            display: grid;
            grid-template-columns: repeat(var(--grid-size), 1fr);
            grid-template-rows: repeat(var(--grid-size), 1fr);
            gap: var(--board-gap);
            width: 100%;
            height: 100%;
        }

        .cell {
            background-color: rgba(15, 23, 42, 0.6);
            border-radius: var(--radius-md);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(255, 255, 255, 0.02);
            position: relative;
            outline: none;
            font-size: 2.2rem;
        }

        .board-container[data-size="4"] .cell {
            font-size: 1.8rem;
        }
        .board-container[data-size="5"] .cell {
            font-size: 1.4rem;
        }

        .cell:hover:not(.occupied) {
            background-color: rgba(15, 23, 42, 0.9);
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .cell:active:not(.occupied) {
            transform: translateY(1px);
        }

        /* Marcadores do jogo */
        .cell-marker {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            animation: bounceIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        .cell.winner {
            background-color: rgba(99, 102, 241, 0.25);
            border-color: var(--accent);
            animation: pulse-winner 1.5s infinite alternate;
        }

        @keyframes pulse-winner {
            0% { transform: scale(1); }
            100% { transform: scale(1.02); box-shadow: 0 0 15px rgba(99, 102, 241, 0.4); }
        }

        /* Menu Modal de Configurações */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 20px;
        }

        .modal.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background-color: var(--bg-secondary);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 420px;
            padding: 24px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal.open .modal-content {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 12px;
        }

        .modal-header h2 {
            font-size: 1.5rem;
            font-weight: 800;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.5rem;
        }

        .modal-close:hover {
            color: var(--text-main);
        }

        /* Configurações internas do Modal */
        .config-section {
            margin-bottom: 20px;
        }

        .config-label {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 8px;
            display: block;
            color: var(--text-muted);
        }

        /* Inputs de Texto */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-field {
            background-color: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: var(--radius-md);
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
        }

        .input-field:focus {
            border-color: var(--accent);
        }

        .input-field:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Seleção de Marcadores */
        .markers-container {
            display: flex;
            gap: 16px;
        }

        .marker-select-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .marker-options {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .marker-opt {
            background-color: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 1.3rem;
            padding: 6px;
            border-radius: var(--radius-md);
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .marker-opt:hover:not(.disabled) {
            background-color: rgba(255, 255, 255, 0.05);
        }

        .marker-opt.selected {
            border-color: var(--accent);
            background-color: rgba(99, 102, 241, 0.15);
        }

        .marker-opt.disabled {
            opacity: 0.25;
            cursor: not-allowed;
        }

        /* Grid de Opções de Tema e Tamanho */
        .pill-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .pill-btn {
            background-color: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s;
            flex: 1;
            min-width: 80px;
            text-align: center;
        }

        .pill-btn:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        .pill-btn.active {
            border-color: var(--accent);
            background-color: var(--accent);
            color: var(--text-main);
        }

        /* Rodapé de Ações do Jogo */
        .actions {
            width: 100%;
            display: flex;
            gap: 12px;
        }

        .btn {
            flex: 1;
            background-color: var(--bg-secondary);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 14px;
            border-radius: var(--radius-md);
            font-family: inherit;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: var(--shadow);
        }

        .btn:hover {
            background-color: #2e3c51;
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), #4f46e5);
            border: none;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #7073f3, #5a52e6);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }

        /* Overlay de Fim de Jogo */
        .game-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            border-radius: var(--radius-lg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 10;
            padding: 20px;
            text-align: center;
        }

        .game-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .winner-announcement {
            transform: translateY(20px);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .game-overlay.show .winner-announcement {
            transform: translateY(0);
        }

        .winner-icon {
            font-size: 4rem;
            margin-bottom: 12px;
            text-align: center;
            display: block;
        }

        .winner-text {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .winner-subtext {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 24px;
        }

        .btn-overlay {
            min-width: 160px;
            margin: 0 auto;
        }

        /* Responsividade para telas muito pequenas */
        @media (max-width: 400px) {
            header h1 {
                font-size: 1.8rem;
            }
            .score-value {
                font-size: 1.2rem;
            }
            .score-label {
                font-size: 0.6rem;
            }
            .btn {
                padding: 12px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="header-title">
                <h1>Jogo da Velha</h1>
                <p>Configurável e Moderno</p>
            </div>
            <button class="settings-trigger" id="settings-trigger-btn" aria-label="Abrir Configurações">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </button>
        </header>

        <!-- Controles de Modo de Jogo rápidos -->
        <section class="controls">
            <div class="mode-selection" aria-label="Seletor de Modo de Jogo">
                <button class="mode-btn active" data-mode="ai">Contra a IA</button>
                <button class="mode-btn" data-mode="pvp">Dois Jogadores</button>
            </div>
            <div class="difficulty-selection" aria-label="Seletor de Dificuldade da IA">
                <button class="diff-btn" data-diff="easy">Fácil</button>
                <button class="diff-btn active" data-diff="impossible">Impossível</button>
            </div>
        </section>

        <!-- Placar -->
        <section class="scoreboard">
            <div class="score-box player-x active-turn" id="score-x-box">
                <div class="score-label" id="label-x">Jogador (X)</div>
                <div class="score-value" id="score-x">0</div>
            </div>
            <div class="score-box draws">
                <div class="score-label">Empates</div>
                <div class="score-value" id="score-draws">0</div>
            </div>
            <div class="score-box player-o" id="score-o-box">
                <div class="score-label" id="label-o">IA (O)</div>
                <div class="score-value" id="score-o">0</div>
            </div>
        </section>

        <!-- Arena do Jogo -->
        <main class="board-container" id="board-container" data-size="3">
            <div class="board" id="board" role="grid" aria-label="Tabuleiro do Jogo da Velha">
                <!-- Células geradas dinamicamente via Javascript -->
            </div>

            <!-- Overlay de Vitória/Empate -->
            <div class="game-overlay" id="game-overlay">
                <div class="winner-announcement">
                    <div class="winner-icon" id="winner-icon-container"></div>
                    <div class="winner-text" id="winner-text-msg">Jogador Venceu!</div>
                    <div class="winner-subtext" id="winner-subtext-msg">Excelente jogada na rodada.</div>
                    <button class="btn btn-primary btn-overlay" id="overlay-restart-btn">Jogar Novamente</button>
                </div>
            </div>
        </main>

        <!-- Ações do Jogo -->
        <footer class="actions">
            <button class="btn" id="reset-scores-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
                Zerar Placar
            </button>
            <button class="btn btn-primary" id="restart-game-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
                Reiniciar Rodada
            </button>
        </footer>
    </div>

    <!-- Modal de Configurações -->
    <div class="modal" id="settings-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Configurações</h2>
                <button class="modal-close" id="settings-close-btn">&times;</button>
            </div>
            
            <!-- Configuração de Nomes -->
            <div class="config-section">
                <span class="config-label">Nomes dos Jogadores</span>
                <div class="input-group">
                    <input type="text" class="input-field" id="name-input-x" placeholder="Jogador 1 (Inicia com X)" maxlength="12">
                    <input type="text" class="input-field" id="name-input-o" placeholder="Jogador 2 (O)" maxlength="12">
                </div>
            </div>

            <!-- Configuração de Marcadores -->
            <div class="config-section">
                <span class="config-label">Selecione os Marcadores</span>
                <div class="markers-container">
                    <div class="marker-select-box">
                        <span style="font-size: 0.8rem; color: var(--text-muted); font-weight: 600;">Jogador 1</span>
                        <div class="marker-options" id="options-p1">
                            <!-- Injetado dinamicamente -->
                        </div>
                    </div>
                    <div class="marker-select-box">
                        <span style="font-size: 0.8rem; color: var(--text-muted); font-weight: 600;">Jogador 2 / IA</span>
                        <div class="marker-options" id="options-p2">
                            <!-- Injetado dinamicamente -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Configuração de Tamanho do Tabuleiro -->
            <div class="config-section">
                <span class="config-label">Tamanho do Tabuleiro</span>
                <div class="pill-grid" id="board-size-options">
                    <button class="pill-btn active" data-size="3">3x3</button>
                    <button class="pill-btn" data-size="4">4x4</button>
                    <button class="pill-btn" data-size="5">5x5</button>
                </div>
            </div>

            <!-- Configuração de Tema -->
            <div class="config-section">
                <span class="config-label">Tema Visual</span>
                <div class="pill-grid" id="theme-options">
                    <button class="pill-btn active" data-theme="dark">Escuro</button>
                    <button class="pill-btn" data-theme="light">Claro</button>
                    <button class="pill-btn" data-theme="cyberpunk">Cyberpunk</button>
                    <button class="pill-btn" data-theme="emerald">Esmeralda</button>
                    <button class="pill-btn" data-theme="sunset">Pôr do Sol</button>
                </div>
            </div>

            <button class="btn btn-primary" id="save-settings-btn" style="width: 100%; margin-top: 10px;">Aplicar Alterações</button>
        </div>
    </div>

    <script>
        // --- SINTETIZADOR DE ÁUDIO (Web Audio API) ---
        const Sound = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            },
            playClick() {
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.04, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.08);
            },
            playCPU() {
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(330, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(660, this.ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.03, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.1);
            },
            playWin() {
                this.init();
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, index) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime + (index * 0.1));
                    gain.gain.setValueAtTime(0.04, this.ctx.currentTime + (index * 0.1));
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + (index * 0.1) + 0.3);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(this.ctx.currentTime + (index * 0.1));
                    osc.stop(this.ctx.currentTime + (index * 0.1) + 0.35);
                });
            },
            playDraw() {
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(150, this.ctx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.04, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.25);
            }
        };

        // --- MODELAGEM E ESTADO DO JOGO ---
        const Game = {
            boardSize: 3,
            board: [],
            currentPlayer: 'X',
            isGameActive: true,
            gameMode: 'ai', // 'ai' ou 'pvp'
            difficulty: 'impossible', // 'easy' ou 'impossible'
            scores: { X: 0, O: 0, draws: 0 },
            
            // Definição dos nomes e marcadores customizados
            names: { X: 'Jogador 1', O: 'IA' },
            markers: { X: '❌', O: '⭕' },
            markerList: ['❌', '⭕', '⭐', '❤️', '🔥', '💧', '⚡', '👑'],

            winningConditions: [],

            init() {
                this.generateWinningConditions();
                this.resetRound();
            },

            // Cria dinamicamente as combinações vencedoras com base no tamanho do tabuleiro
            generateWinningConditions() {
                const size = this.boardSize;
                this.winningConditions = [];

                // Linhas
                for (let i = 0; i < size; i++) {
                    const row = [];
                    for (let j = 0; j < size; j++) {
                        row.push(i * size + j);
                    }
                    this.winningConditions.push(row);
                }

                // Colunas
                for (let i = 0; i < size; i++) {
                    const col = [];
                    for (let j = 0; j < size; j++) {
                        col.push(i + j * size);
                    }
                    this.winningConditions.push(col);
                }

                // Diagonal principal
                const diag1 = [];
                for (let i = 0; i < size; i++) {
                    diag1.push(i * size + i);
                }
                this.winningConditions.push(diag1);

                // Diagonal secundária
                const diag2 = [];
                for (let i = 0; i < size; i++) {
                    diag2.push(i * size + (size - 1 - i));
                }
                this.winningConditions.push(diag2);
            },

            resetRound() {
                this.board = Array(this.boardSize * this.boardSize).fill(null);
                this.currentPlayer = 'X';
                this.isGameActive = true;
            },

            resetScores() {
                this.scores = { X: 0, O: 0, draws: 0 };
                this.resetRound();
            },

            makeMove(index, player) {
                if (this.board[index] === null && this.isGameActive) {
                    this.board[index] = player;
                    return true;
                }
                return false;
            },

            switchPlayer() {
                this.currentPlayer = this.currentPlayer === 'X' ? 'O' : 'X';
            },

            checkWinner() {
                const size = this.boardSize;
                for (let i = 0; i < this.winningConditions.length; i++) {
                    const condition = this.winningConditions[i];
                    const firstVal = this.board[condition[0]];
                    if (firstVal) {
                        const isWin = condition.every(index => this.board[index] === firstVal);
                        if (isWin) {
                            return { winner: firstVal, combination: condition };
                        }
                    }
                }
                if (!this.board.includes(null)) {
                    return { winner: 'Draw', combination: [] };
                }
                return null;
            },

            // --- INTELIGÊNCIA ARTIFICIAL (Otimizada) ---
            getBestMove() {
                if (this.difficulty === 'easy') {
                    const availableMoves = this.board.map((val, idx) => val === null ? idx : null).filter(val => val !== null);
                    return availableMoves[Math.floor(Math.random() * availableMoves.length)];
                }

                // Usar Minimax clássico apenas para tabuleiros 3x3 para evitar travamento da CPU
                if (this.boardSize === 3) {
                    let bestScore = -Infinity;
                    let move = null;
                    for (let i = 0; i < 9; i++) {
                        if (this.board[i] === null) {
                            this.board[i] = 'O';
                            let score = this.minimax(this.board, 0, false);
                            this.board[i] = null;
                            if (score > bestScore) {
                                bestScore = score;
                                move = i;
                            }
                        }
                    }
                    return move;
                } else {
                    // Para 4x4 e 5x5: Usar Algoritmo Heurístico Avançado de Decisão Ultrarápido
                    return this.getSmartHeuristicMove();
                }
            },

            minimax(board, depth, isMaximizing) {
                const result = this.checkWinner();
                if (result !== null) {
                    if (result.winner === 'O') return 10 - depth;
                    if (result.winner === 'X') return depth - 10;
                    if (result.winner === 'Draw') return 0;
                }

                if (isMaximizing) {
                    let bestScore = -Infinity;
                    for (let i = 0; i < 9; i++) {
                        if (board[i] === null) {
                            board[i] = 'O';
                            let score = this.minimax(board, depth + 1, false);
                            board[i] = null;
                            bestScore = Math.max(score, bestScore);
                        }
                    }
                    return bestScore;
                } else {
                    let bestScore = Infinity;
                    for (let i = 0; i < 9; i++) {
                        if (board[i] === null) {
                            board[i] = 'X';
                            let score = this.minimax(board, depth + 1, true);
                            board[i] = null;
                            bestScore = Math.min(score, bestScore);
                        }
                    }
                    return bestScore;
                }
            },

            // Heurística rápida e extremamente inteligente para 4x4 e 5x5
            getSmartHeuristicMove() {
                const size = this.boardSize;
                
                // 1. Tentar ganhar imediatamente neste turno
                for (let i = 0; i < this.winningConditions.length; i++) {
                    const line = this.winningConditions[i];
                    const countO = line.filter(idx => this.board[idx] === 'O').length;
                    const countEmpty = line.filter(idx => this.board[idx] === null).length;
                    if (countO === size - 1 && countEmpty === 1) {
                        return line.find(idx => this.board[idx] === null);
                    }
                }

                // 2. Bloquear o oponente de ganhar
                for (let i = 0; i < this.winningConditions.length; i++) {
                    const line = this.winningConditions[i];
                    const countX = line.filter(idx => this.board[idx] === 'X').length;
                    const countEmpty = line.filter(idx => this.board[idx] === null).length;
                    if (countX === size - 1 && countEmpty === 1) {
                        return line.find(idx => this.board[idx] === null);
                    }
                }

                // 3. Bloquear construções perigosas de nível 2 (se faltar 2 para oponente ganhar)
                if (size > 3) {
                    for (let i = 0; i < this.winningConditions.length; i++) {
                        const line = this.winningConditions[i];
                        const countX = line.filter(idx => this.board[idx] === 'X').length;
                        const countEmpty = line.filter(idx => this.board[idx] === null).length;
                        if (countX === size - 2 && countEmpty === 2) {
                            return line.find(idx => this.board[idx] === null);
                        }
                    }
                }

                // 4. Se o centro estiver livre, dominar o centro
                const centerIdx = Math.floor((size * size) / 2);
                if (this.board[centerIdx] === null) return centerIdx;

                // 5. Escolher cantos prioritários livres
                const corners = [0, size - 1, size * (size - 1), (size * size) - 1];
                const freeCorners = corners.filter(idx => this.board[idx] === null);
                if (freeCorners.length > 0) {
                    return freeCorners[Math.floor(Math.random() * freeCorners.length)];
                }

                // 6. Fallback final: qualquer espaço vazio randômico
                const availableMoves = this.board.map((val, idx) => val === null ? idx : null).filter(val => val !== null);
                return availableMoves[Math.floor(Math.random() * availableMoves.length)];
            }
        };

            // Cria dinamicamente o tabuleiro no HTML com base no tamanho configurado
            rebuildGameBoard() {
                this.board.innerHTML = '';
                document.documentElement.style.setProperty('--grid-size', Game.boardSize);
                this.boardContainer.setAttribute('data-size', Game.boardSize);
                
                const totalCells = Game.boardSize * Game.boardSize;
                this.cells = [];

                for (let i = 0; i < totalCells; i++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.setAttribute('data-index', i);
                    cell.setAttribute('role', 'button');
                    cell.setAttribute('tabindex', '0');
                    cell.setAttribute('aria-label', `Quadrante ${i + 1}`);
                    
                    cell.addEventListener('click', (e) => this.handleCellClick(e));
                    cell.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            this.handleCellClick(e);
                        }
                    });

                    this.board.appendChild(cell);
                    this.cells.push(cell);
                }
            },

            // Carrega as configurações correntes para as opções do modal
            loadConfigToForm() {
                this.tempP1Marker = Game.markers.X;
                this.tempP2Marker = Game.markers.O;
                this.tempBoardSize = Game.boardSize;
                this.tempTheme = Themes.activeTheme;

                this.nameInputX.value = Game.names.X;
                this.nameInputO.value = Game.gameMode === 'ai' ? 'IA' : Game.names.O;
                this.nameInputO.disabled = Game.gameMode === 'ai';

                this.updateThemeActivePills();
                this.updateBoardSizeActivePills();
                this.updateMarkerSelections();
            },

            // Atualiza os marcadores disponíveis na tela garantindo exclusividade
            buildMarkerSelection() {
                const makeGrid = (container, playerKey) => {
                    container.innerHTML = '';
                    Game.markerList.forEach(marker => {
                        const opt = document.createElement('button');
                        opt.className = 'marker-opt';
                        opt.textContent = marker;
                        opt.dataset.marker = marker;
                        opt.addEventListener('click', () => this.selectMarker(playerKey, marker));
                        container.appendChild(opt);
                    });
                };

                makeGrid(this.optionsP1Container, 'X');
                makeGrid(this.optionsP2Container, 'O');
            },

            selectMarker(playerKey, marker) {
                if (playerKey === 'X') {
                    if (this.tempP2Marker === marker) return; // Não permitir duplicado
                    this.tempP1Marker = marker;
                } else {
                    if (this.tempP1Marker === marker) return; // Não permitir duplicado
                    this.tempP2Marker = marker;
                }
                Sound.playClick();
                this.updateMarkerSelections();
            },

            updateMarkerSelections() {
                // Atualizar player 1
                this.optionsP1Container.querySelectorAll('.marker-opt').forEach(btn => {
                    btn.classList.toggle('selected', btn.dataset.marker === this.tempP1Marker);
                    btn.classList.toggle('disabled', btn.dataset.marker === this.tempP2Marker);
                });
                // Atualizar player 2
                this.optionsP2Container.querySelectorAll('.marker-opt').forEach(btn => {
                    btn.classList.toggle('selected', btn.dataset.marker === this.tempP2Marker);
                    btn.classList.toggle('disabled', btn.dataset.marker === this.tempP1Marker);
                });
            },

            updateThemeActivePills() {
                this.themeOptions.querySelectorAll('.pill-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.theme === this.tempTheme);
                });
            },

            updateBoardSizeActivePills() {
                this.boardSizeOptions.querySelectorAll('.pill-btn').forEach(btn => {
                    btn.classList.toggle('active', parseInt(btn.dataset.size) === this.tempBoardSize);
                });
            },

            // Salva todas as configurações alteradas
            applyConfig() {
                // Salvar nomes com fallback de texto limpo
                Game.names.X = this.nameInputX.value.trim() || 'Jogador 1';
                if (Game.gameMode !== 'ai') {
                    Game.names.O = this.nameInputO.value.trim() || 'Jogador 2';
                } else {
                    Game.names.O = 'IA';
                }

                // Salvar marcadores
                Game.markers.X = this.tempP1Marker;
                Game.markers.O = this.tempP2Marker;

                // Salvar tamanho do tabuleiro
                if (Game.boardSize !== this.tempBoardSize) {
                    Game.boardSize = this.tempBoardSize;
                    Game.generateWinningConditions();
                    this.rebuildGameBoard();
                }

                Themes.apply(this.tempTheme);
                this.updateLabels();
                this.resetAll();
            },

            handleCellClick(e) {
                const cell = e.currentTarget;
                const index = parseInt(cell.dataset.index);

                if (!Game.isGameActive || Game.board[index] !== null) return;
                if (Game.gameMode === 'ai' && Game.currentPlayer === 'O') return;

                this.executePlay(index);
            },

            executePlay(index) {
                const activePlayer = Game.currentPlayer;
                if (Game.makeMove(index, activePlayer)) {
                    if (activePlayer === 'X') {
                        Sound.playClick();
                    } else {
                        Sound.playCPU();
                    }

                    this.renderCell(index, activePlayer);
                    this.checkGameState();

                    if (Game.isGameActive) {
                        Game.switchPlayer();
                        this.updateActiveTurn();

                        if (Game.gameMode === 'ai' && Game.currentPlayer === 'O') {
                            setTimeout(() => this.executeAIMove(), 500);
                        }
                    }
                }
            },

            executeAIMove() {
                if (!Game.isGameActive) return;
                const aiMove = Game.getBestMove();
                if (aiMove !== null) {
                    this.executePlay(aiMove);
                }
            },

            renderCell(index, player) {
                const cell = this.cells[index];
                cell.classList.add('occupied');
                
                const markerContainer = document.createElement('span');
                markerContainer.className = 'cell-marker';
                markerContainer.textContent = Game.markers[player];
                cell.appendChild(markerContainer);
            },

            checkGameState() {
                const state = Game.checkWinner();
                if (state) {
                    Game.isGameActive = false;
                    
                    if (state.winner === 'Draw') {
                        Game.scores.draws++;
                        this.showOverlay('Draw');
                        Sound.playDraw();
                    } else {
                        Game.scores[state.winner]++;
                        state.combination.forEach(idx => {
                            this.cells[idx].classList.add('winner');
                        });
                        this.showOverlay(state.winner);
                        Sound.playWin();
                    }
                    this.updateScores();
                }
            },

            updateActiveTurn() {
                if (Game.currentPlayer === 'X') {
                    this.scoreXBox.classList.add('active-turn');
                    this.scoreOBox.classList.remove('active-turn');
                } else {
                    this.scoreOBox.classList.add('active-turn');
                    this.scoreXBox.classList.remove('active-turn');
                }
            },

            updateScores() {
                this.scoreX.textContent = Game.scores.X;
                this.scoreO.textContent = Game.scores.O;
                this.scoreDraws.textContent = Game.scores.draws;
            },

            updateLabels() {
                this.labelX.textContent = `${Game.names.X} (${Game.markers.X})`;
                this.labelO.textContent = `${Game.names.O} (${Game.markers.O})`;
                
                if (Game.gameMode === 'ai') {
                    this.diffSection.classList.remove('hidden');
                } else {
                    this.diffSection.classList.add('hidden');
                }
            },

            changeMode(mode) {
                if (Game.gameMode !== mode) {
                    Game.gameMode = mode;
                    this.modeBtns.forEach(btn => {
                        btn.classList.toggle('active', btn.dataset.mode === mode);
                    });
                    this.updateLabels();
                    this.resetAll();
                }
            },

            changeDifficulty(diff) {
                if (Game.difficulty !== diff) {
                    Game.difficulty = diff;
                    this.diffBtns.forEach(btn => {
                        btn.classList.toggle('active', btn.dataset.diff === diff);
                    });
                    this.resetAll();
                }
            },

            showOverlay(winner) {
                setTimeout(() => {
                    if (winner === 'X') {
                        this.winnerIconContainer.textContent = Game.markers.X;
                        this.winnerMsg.textContent = `${Game.names.X} Venceu!`;
                        this.winnerSubmsg.textContent = "Excelente rodada e jogadas estratégicas!";
                    } else if (winner === 'O') {
                        this.winnerIconContainer.textContent = Game.markers.O;
                        this.winnerMsg.textContent = `${Game.names.O} Venceu!`;
                        this.winnerSubtext(winner);
                    } else {
                        this.winnerIconContainer.textContent = "🤝";
                        this.winnerMsg.textContent = "Empate!";
                        this.winnerSubmsg.textContent = "Equilíbrio tático perfeito nesta rodada.";
                    }

                    this.overlay.classList.add('show');
                }, 600);
            },

            winnerSubtext(winner) {
                if (Game.gameMode === 'ai') {
                    this.winnerSubmsg.textContent = "Não desanime. Nosso algoritmo é treinado estrategicamente!";
                } else {
                    this.winnerSubmsg.textContent = "Vitória magnífica do Jogador 2!";
                }
            },

            restartRound() {
                Game.resetRound();
                this.overlay.classList.remove('show');
                this.render();
            },

            resetAll() {
                Game.resetScores();
                this.overlay.classList.remove('show');
                this.updateScores();
                this.render();
            },

            render() {
                this.cells.forEach(cell => {
                    cell.className = 'cell';
                    cell.innerHTML = '';
                });
                this.updateActiveTurn();
            }
        };

        // Iniciar
        document.addEventListener('DOMContentLoaded', () => {
            UI.init();
        });
    </script>
</body>
</html>
